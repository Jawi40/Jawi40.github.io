<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Jitsi Embed – Improved</title>

    <!-- Load Jitsi/JaaS External API -->
    <script src="https://8x8.vc/vpaas-magic-cookie-3e1b3be57d9c4595be4a66f74c20a33a/external_api.js"></script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            background: #000;
        }
        #jaas-container {
            width: 100%;
            height: 100%;
            background: #000;
        }
    </style>
</head>

<body>
    <div id="jaas-container"></div>

    <script>
        function startJitsi() {
            const domain = "8x8.vc";

            const options = {
                roomName: "vpaas-magic-cookie-3e1b3be57d9c4595be4a66f74c20a33a/SampleAppBlankWallsMinimizeReally",
                parentNode: document.getElementById("jaas-container"),

                // Optional UI customizations
                interfaceConfigOverwrite: {
                    // Example: hide some buttons
                    // TOOLBAR_BUTTONS: ["microphone", "camera", "chat", "hangup"]
                },

                configOverwrite: {
                    // Example: start muted
                    // startWithAudioMuted: true,
                    // startWithVideoMuted: true
                },

                // Optional: JWT for premium features (recording, SIP, outbound calls)
                // jwt: "YOUR_JWT_HERE"
            };

            try {
                const api = new JitsiMeetExternalAPI(domain, options);

                // Example event listeners
                api.addEventListener("videoConferenceJoined", () => {
                    console.log("Joined the meeting");
                });

                api.addEventListener("readyToClose", () => {
                    console.log("Meeting ended");
                });

            } catch (error) {
                console.error("Jitsi API failed to load:", error);
                document.getElementById("jaas-container").innerHTML =
                    "<p style='color:white; text-align:center; padding-top:20px;'>Failed to load Jitsi meeting.</p>";
            }
        }

        // Ensure API loads after DOM is ready
        window.onload = startJitsi;
    </script>
</body>
</html>
