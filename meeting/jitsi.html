<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">

    <script src="https://8x8.vc/vpaas-magic-cookie-3e1b3be57d9c4595be4a66f74c20a33a/external_api.js" async></script>

    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      /* Dynamic viewport height fix */
      :root {
        --vh: 100%;
      }

      #jaas-container {
        height: calc(var(--vh) * 100);
        width: 100vw;
        position: relative;
        padding-bottom: env(safe-area-inset-bottom); /* iPhone notch fix */
        overflow: hidden;
      }

      /* Force Jitsi iframe to fill container */
      #jaas-container iframe {
        position: absolute;
        top: 0;
        left: 0;
        width: 100% !important;
        height: 100% !important;
      }
    </style>

    <script>
      // Fix mobile viewport height on resize/orientation change
      function updateVH() {
        document.documentElement.style.setProperty('--vh', window.innerHeight * 0.01);
      }
      window.addEventListener('resize', updateVH);
      window.addEventListener('orientationchange', updateVH);
      updateVH();

      window.onload = () => {
        const api = new JitsiMeetExternalAPI("8x8.vc", {
          roomName: "vpaas-magic-cookie-3e1b3be57d9c4595be4a66f74c20a33a/SampleAppBlankWallsMinimizeReally",
          parentNode: document.querySelector('#jaas-container')
        });
      };
    </script>
  </head>

  <body>
    <div id="jaas-container"></div>
  </body>
</html>
