<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"> 
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome</title>

  <!-- Your existing CSS -->
  <link rel="stylesheet" href="../css/style.css">

  <style>
    /* --- Jamaican-Themed Gold Buttons --- */

    .nav-button {
      display: block;
      width: 260px;
      padding: 15px;
      background: #FFD700; /* Gold base */
      color: #111; /* Dark text */
      border-radius: 10px;
      font-size: 22px;
      text-decoration: none;
      text-align: center;
      transition: 0.25s ease;
      border: 2px solid #FFD700;
      font-weight: bold;
    }

    .nav-button:hover {
      background: #111; /* Black hover */
      border-color: #FFD700;
      color: #FFD700; /* Gold text */
      transform: scale(1.05);
    }

    .intro-text {
      max-width: 700px;
      margin: 20px auto 40px;
      text-align: center;
      font-size: 18px;
      line-height: 1.6;
      color: #fff; /* Visible on dark backgrounds */
    }
  </style>
</head>

<body>

<!-- HEADER PARTIAL -->
<div id="header"></div>

<script>
document.addEventListener("DOMContentLoaded", () => {
    fetch(window.location.origin + "/partials/header.html")
        .then(response => {
            if (!response.ok) throw new Error("Header failed to load");
            return response.text();
        })
        .then(html => {
            document.getElementById("header").innerHTML = html;
        })
        .catch(err => {
            console.error("HEADER LOAD ERROR:", err);
        });
});
</script>

<main class="page-wrapper">

  <!-- LANDING PAGE TITLE -->
  <h1 class="page-title" style="text-align:center; margin-top:40px; color:#FFD700;">
    Welcome
  </h1>

  <!-- SHORT POETIC INTRODUCTION (Option 1) -->
  <div class="intro-text">
    <strong>JAMEXUS</strong> is shaped by rhythm, intention, and quiet sparks of possibility.<br>
    Each choice opens into its own world — some filled with sound, some with movement, some with ideas waiting to awaken. Select your desired experience.<br>
  </div>

  <!-- BUTTON SECTION -->
  <section style="display:flex; flex-direction:column; align-items:center; gap:20px;">

     <a class="nav-button" href="/services/">
        Services
      </a> 
    <a class="nav-button" href="/infin8radio/">
        iRadio
      </a>

      <a class="nav-button" href="/events/">
        Events
      </a>

      <a class="nav-button" href="/businesshub/">
        Business-Hub
      </a>

      <a class="nav-button" href="/about/">
        About
      </a>

      <a class="nav-button" href="/contact/">
        Contact
      </a>

  </section>

</main>

<!-- FOOTER PARTIAL -->
<div id="footer"></div>

<script>
  fetch("/partials/footer.html")
    .then(r => r.text())
    .then(t => document.getElementById("footer").innerHTML = t);
</script>

<!-- MOBILE MENU SCRIPTS -->
<script>
function toggleMenu() {
    const nav = document.getElementById("mobile-nav");
    nav.classList.toggle("show");
    document.querySelector(".hamburger").blur();
}

function closeMenu() {
    const nav = document.getElementById("mobile-nav");
    nav.classList.remove("show");
    document.querySelector(".hamburger").blur();
}
</script>

</body>
</html>
